<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        LIBYA FLEX | لوحة التحكم
    </title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Tahoma, sans-serif;
        }

        :root {
            --primary: #0d6b4d;
            --dark: #101820;
            --light: #f5f7f6;
            --white: #fff;
            --danger: #d62828;
            --border: #e3e7e5;
        }

        body {
            background: var(--light);
            color: var(--dark);
        }

        header {
            background: var(--dark);
            color: white;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        header h1 {
            font-size: 24px;
        }

        .back {
            background: white;
            color: var(--dark);
            padding: 10px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            padding: 35px 5%;
            max-width: 1300px;
            margin: auto;
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(180px, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }

        .stat {
            background: white;
            border-radius: 14px;
            padding: 25px;
            border: 1px solid var(--border);
        }

        .stat-icon {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .stat-number {
            font-size: 30px;
            font-weight: 900;
        }

        .stat-label {
            color: #777;
            margin-top: 5px;
        }

        .panel {
            background: white;
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .panel-header h2 {
            font-size: 22px;
        }

        .btn {
            padding: 11px 17px;
            border-radius: 8px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-gray {
            background: #eee;
            color: #222;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid var(--border);
            text-align: right;
        }

        th {
            background: #f7f8f8;
        }

        .product-image {
            width: 55px;
            height: 55px;
            border-radius: 8px;
            background: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.6);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            width: min(600px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 15px;
            padding: 25px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: #eee;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .submit {
            width: 100%;
            padding: 14px;
            border: none;
            background: var(--primary);
            color: white;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #777;
        }

        @media(max-width:600px) {

            header {
                flex-direction: column;
                align-items: stretch;
            }

            .back {
                text-align: center;
            }

            main {
                padding: 20px 4%;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        🇱🇾 LIBYA FLEX — لوحة التحكم
    </h1>

    <a
        href="index.html"
        class="back"
    >
        ← العودة للمتجر
    </a>

</header>


<main>


    <!-- STATS -->

    <section class="stats">

        <div class="stat">

            <div class="stat-icon">
                📦
            </div>

            <div
                class="stat-number"
                id="productCount"
            >
                0
            </div>

            <div class="stat-label">
                المنتجات
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                🛒
            </div>

            <div
                class="stat-number"
                id="orderCount"
            >
                0
            </div>

            <div class="stat-label">
                الطلبات
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                💰
            </div>

            <div
                class="stat-number"
                id="salesTotal"
            >
                0 د.ل
            </div>

            <div class="stat-label">
                إجمالي الطلبات
            </div>

        </div>

    </section>


    <!-- PRODUCTS -->

    <section class="panel">

        <div class="panel-header">

            <h2>
                إدارة المنتجات
            </h2>

            <button
                class="btn btn-primary"
                onclick="openProductModal()"
            >
                + إضافة منتج
            </button>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            المنتج
                        </th>

                        <th>
                            القسم
                        </th>

                        <th>
                            السعر
                        </th>

                        <th>
                            الإجراءات
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="productsTable"
                ></tbody>

            </table>

        </div>

    </section>


    <!-- ORDERS -->

    <section class="panel">

        <div class="panel-header">

            <h2>
                الطلبات
            </h2>

            <button
                class="btn btn-danger"
                onclick="clearOrders()"
            >
                حذف كل الطلبات
            </button>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            رقم الطلب
                        </th>

                        <th>
                            العميل
                        </th>

                        <th>
                            الهاتف
                        </th>

                        <th>
                            المدينة
                        </th>

                        <th>
                            الإجمالي
                        </th>

                        <th>
                            التاريخ
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="ordersTable"
                ></tbody>

            </table>

        </div>

    </section>


</main>


<!-- PRODUCT MODAL -->

<div
    class="modal"
    id="productModal"
>

    <div class="modal-content">


        <div class="modal-header">

            <h2
                id="modalTitle"
            >
                إضافة منتج
            </h2>

            <button
                class="close"
                onclick="closeProductModal()"
            >
                ✕
            </button>

        </div>


        <form
            onsubmit="saveProduct(event)"
        >

            <input
                type="hidden"
                id="productId"
            >


            <div class="form-group">

                <label>
                    اسم المنتج
                </label>

                <input
                    type="text"
                    id="productName"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    القسم
                </label>

                <select
                    id="productCategory"
                    required
                >

                    <option value="">
                        اختر القسم
                    </option>

                    <option>
                        إلكترونيات
                    </option>

                    <option>
                        ملابس
                    </option>

                    <option>
                        أحذية
                    </option>

                    <option>
                        إكسسوارات
                    </option>

                    <option>
                        منزل
                    </option>

                    <option>
                        أخرى
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    السعر بالدينار الليبي
                </label>

                <input
                    type="number"
                    id="productPrice"
                    min="0"
                    step="0.01"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    رابط صورة المنتج
                </label>

                <input
                    type="url"
                    id="productImage"
                    placeholder="https://..."
                >

            </div>


            <div class="form-group">

                <label>
                    وصف المنتج
                </label>

                <textarea
                    id="productDescription"
                ></textarea>

            </div>


            <button
                class="submit"
                type="submit"
            >
                حفظ المنتج
            </button>

        </form>


    </div>

</div>


<script>

    /* =========================
       PRODUCTS
    ========================= */

    const defaultProducts = [

        {
            id: 1,
            name: "هاتف ذكي",
            category: "إلكترونيات",
            price: 1299,
            description: "هاتف ذكي للاستخدام اليومي.",
            image: "",
            emoji: "📱"
        },

        {
            id: 2,
            name: "سماعات لاسلكية",
            category: "إلكترونيات",
            price: 149,
            description: "سماعات لاسلكية بجودة صوت ممتازة.",
            image: "",
            emoji: "🎧"
        },

        {
            id: 3,
            name: "ساعة ذكية",
            category: "إكسسوارات",
            price: 299,
            description: "ساعة ذكية للاستخدام اليومي.",
            image: "",
            emoji: "⌚"
        },

        {
            id: 4,
            name: "حذاء رياضي",
            category: "أحذية",
            price: 220,
            description: "حذاء رياضي مريح.",
            image: "",
            emoji: "👟"
        }

    ];


    let products =
        JSON.parse(
            localStorage.getItem(
                "libyaFlexProducts"
            )
        ) || defaultProducts;


    let orders =
        JSON.parse(
            localStorage.getItem(
                "libyaFlexOrders"
            )
        ) || [];


    function saveProducts() {

        localStorage.setItem(
            "libyaFlexProducts",
            JSON.stringify(products)
        );

    }


    /* =========================
       RENDER PRODUCTS
    ========================= */

    function renderProducts() {

        const table =
            document.getElementById(
                "productsTable"
            );


        if (!products.length) {

            table.innerHTML = `
                <tr>
                    <td
                        colspan="4"
                        class="empty"
                    >
                        لا توجد منتجات
                    </td>
                </tr>
            `;

            return;

        }


        table.innerHTML =
            products.map(product => `

                <tr>

                    <td>

                        <div style="
                            display:flex;
                            align-items:center;
                            gap:10px;
                        ">

                            <div class="product-image">

                                ${
                                    product.image

                                    ?

                                    `<img
                                        src="${escapeHtml(product.image)}"
                                    >`

                                    :

                                    `<span>
                                        ${product.emoji || "🛍️"}
                                    </span>`
                                }

                            </div>


                            <strong>
                                ${escapeHtml(product.name)}
                            </strong>

                        </div>

                    </td>


                    <td>
                        ${escapeHtml(product.category)}
                    </td>


                    <td>
                        ${formatPrice(product.price)}
                    </td>


                    <td>

                        <div class="actions">

                            <button
                                class="btn btn-gray"
                                onclick="editProduct(${product.id})"
                            >
                                تعديل
                            </button>

                            <button
                                class="btn btn-danger"
                                onclick="deleteProduct(${product.id})"
                            >
                                حذف
                            </button>

                        </div>

                    </td>

                </tr>

            `).join("");

    }


    /* =========================
       PRODUCT MODAL
    ========================= */

    function openProductModal() {

        document.getElementById(
            "modalTitle"
        ).textContent =
            "إضافة منتج";


        document.getElementById(
            "productId"
        ).value = "";


        document.getElementById(
            "productName"
        ).value = "";


        document.getElementById(
            "productCategory"
        ).value = "";


        document.getElementById(
            "productPrice"
        ).value = "";


        document.getElementById(
            "productImage"
        ).value = "";


        document.getElementById(
            "productDescription"
        ).value = "";


        document.getElementById(
            "productModal"
        ).classList.add("active");

    }


    function closeProductModal() {

        document.getElementById(
            "productModal"
        ).classList.remove("active");

    }


    function editProduct(id) {

        const product =
            products.find(
                p => p.id === id
            );


        if (!product) return;


        document.getElementById(
            "modalTitle"
        ).textContent =
            "تعديل المنتج";


        document.getElementById(
            "productId"
        ).value =
            product.id;


        document.getElementById(
            "productName"
        ).value =
            product.name;


        document.getElementById(
            "productCategory"
        ).value =
            product.category;


        document.getElementById(
            "productPrice"
        ).value =
            product.price;


        document.getElementById(
            "productImage"
        ).value =
            product.image || "";


        document.getElementById(
            "productDescription"
        ).value =
            product.description || "";


        document.getElementById(
            "productModal"
        ).classList.add("active");

    }


    function saveProduct(event) {

        event.preventDefault();


        const id =
            document.getElementById(
                "productId"
            ).value;


        const name =
            document.getElementById(
                "productName"
            ).value.trim();


        const category =
            document.getElementById(
                "productCategory"
            ).value;


        const price =
            Number(
                document.getElementById(
                    "productPrice"
                ).value
            );


        const image =
            document.getElementById(
                "productImage"
            ).value.trim();


        const description =
            document.getElementById(
                "productDescription"
            ).value.trim();


        if (id) {

            const product =
                products.find(
                    p => p.id === Number(id)
                );


            if (product) {

                product.name =
                    name;

                product.category =
                    category;

                product.price =
                    price;

                product.image =
                    image;

                product.description =
                    description;

            }

        } else {

            products.push({

                id:
                    Date.now(),

                name,

                category,

                price,

                image,

                description,

                emoji: "🛍️"

            });

        }


        saveProducts();

        renderProducts();

        updateStats();

        closeProductModal();

    }


    function deleteProduct(id) {

        const confirmed =
            confirm(
                "هل أنت متأكد من حذف هذا المنتج؟"
            );


        if (!confirmed) return;


        products =
            products.filter(
                p => p.id !== id
            );


        saveProducts();

        renderProducts();

        updateStats();

    }


    /* =========================
       ORDERS
    ========================= */

    function renderOrders() {

        const table =
            document.getElementById(
                "ordersTable"
            );


        if (!orders.length) {

            table.innerHTML = `
                <tr>
                    <td
                        colspan="6"
                        class="empty"
                    >
                        لا توجد طلبات حتى الآن
                    </td>
                </tr>
            `;

            return;

        }


        table.innerHTML =
            orders.slice().reverse().map(order => `

                <tr>

                    <td>
                        <strong>
                            ${escapeHtml(order.id)}
                        </strong>
                    </td>


                    <td>
                        ${escapeHtml(
                            order.customer.name
                        )}
                    </td>


                    <td>
                        ${escapeHtml(
                            order.customer.phone
                        )}
                    </td>


                    <td>
                        ${escapeHtml(
                            order.customer.city
                        )}
                    </td>


                    <td>
                        ${formatPrice(
                            order.total
                        )}
                    </td>


                    <td>
                        ${formatDate(
                            order.date
                        )}
                    </td>

                </tr>

            `).join("");

    }


    function clearOrders() {

        const confirmed =
            confirm(
                "هل تريد حذف جميع الطلبات؟"
            );


        if (!confirmed) return;


        orders = [];


        localStorage.setItem(
            "libyaFlexOrders",
            JSON.stringify(orders)
        );


        renderOrders();

        updateStats();

    }


    /* =========================
       STATS
    ========================= */

    function updateStats() {

        document.getElementById(
            "productCount"
        ).textContent =
            products.length;


        document.getElementById(
            "orderCount"
        ).textContent =
            orders.length;


        const total =
            orders.reduce(
                (sum, order) =>
                    sum +
                    Number(order.total || 0),
                0
            );


        document.getElementById(
            "salesTotal"
        ).textContent =
            formatPrice(total);

    }


    /* =========================
       HELPERS
    ========================= */

    function formatPrice(price) {

        return (
            Number(price).toLocaleString(
                "ar-LY"
            )
            + " د.ل"
        );

    }


    function formatDate(date) {

        try {

            return new Date(
                date
            ).toLocaleString(
                "ar-LY"
            );

        } catch {

            return date;

        }

    }


    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =========================
       INITIALIZE
    ========================= */

    renderProducts();

    renderOrders();

    updateStats();

</script>


</body>

</html>
