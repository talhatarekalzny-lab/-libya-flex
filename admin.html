<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Libya Flex - Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6f8;
            color: #111827;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        header span {
            color: #9ca3af;
            font-size: 14px;
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 8px;
            padding: 10px 15px;
            font-weight: bold;
        }

        .logout {
            background: #ef4444;
            color: white;
        }

        main {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .stat h3 {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat p {
            font-size: 28px;
            font-weight: bold;
        }

        .panel {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .panel-header h2 {
            font-size: 20px;
        }

        .search {
            padding: 11px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            width: 250px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background: #f3f4f6;
            text-align: right;
            padding: 13px;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f9fafb;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }

        .pending {
            background: #fef3c7;
            color: #92400e;
        }

        .confirmed {
            background: #dbeafe;
            color: #1e40af;
        }

        .processing {
            background: #ede9fe;
            color: #5b21b6;
        }

        .delivered {
            background: #dcfce7;
            color: #166534;
        }

        .cancelled {
            background: #fee2e2;
            color: #991b1b;
        }

        select {
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            background: white;
        }

        .save-btn {
            background: #16a34a;
            color: white;
            margin-right: 5px;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .history {
            margin-top: 8px;
            font-size: 13px;
            color: #6b7280;
        }

        .history-item {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 700px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .panel-header {
                flex-direction: column;
                align-items: stretch;
            }

            .search {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <div>
        <h1>Libya Flex</h1>
        <span>لوحة تحكم الإدارة</span>
    </div>

    <button class="logout" onclick="logout()">تسجيل الخروج</button>
</header>

<main>

    <div id="message" class="message"></div>

    <!-- Statistics -->

    <section class="stats">

        <div class="stat">
            <h3>كل الطلبات</h3>
            <p id="totalOrders">0</p>
        </div>

        <div class="stat">
            <h3>قيد الانتظار</h3>
            <p id="pendingOrders">0</p>
        </div>

        <div class="stat">
            <h3>مؤكدة</h3>
            <p id="confirmedOrders">0</p>
        </div>

        <div class="stat">
            <h3>تم التوصيل</h3>
            <p id="deliveredOrders">0</p>
        </div>

    </section>


    <!-- Orders -->

    <section class="panel">

        <div class="panel-header">

            <h2>الطلبات</h2>

            <input
                type="text"
                id="searchInput"
                class="search"
                placeholder="ابحث بالاسم أو الهاتف..."
                oninput="filterOrders()"
            >

        </div>

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>#</th>
                        <th>العميل</th>
                        <th>الهاتف</th>
                        <th>العنوان</th>
                        <th>المدينة</th>
                        <th>المبلغ</th>
                        <th>الحالة</th>
                        <th>تحديث</th>
                    </tr>

                </thead>

                <tbody id="ordersTable">

                    <tr>
                        <td colspan="8" class="empty">
                            جاري تحميل الطلبات...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </section>


    <!-- Delivery History -->

    <section class="panel">

        <div class="panel-header">
            <h2>سجل التوصيل</h2>
        </div>

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>#</th>
                        <th>رقم الطلب</th>
                        <th>الحالة</th>
                        <th>ملاحظات</th>
                        <th>التاريخ</th>
                    </tr>

                </thead>

                <tbody id="historyTable">

                    <tr>
                        <td colspan="5" class="empty">
                            جاري تحميل السجل...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>


<script src="supabase.js"></script>
<script src="orders.js"></script>

<script>

let allOrders = [];


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders() {

    try {

        const { data, error } = await supabase
            .from('orders')
            .select('*')
            .order('id', { ascending: false });

        if (error) throw error;

        allOrders = data || [];

        renderOrders(allOrders);

        updateStats(allOrders);

    } catch (error) {

        console.error(error);

        showMessage(
            "حدث خطأ أثناء تحميل الطلبات: " + error.message,
            "error"
        );

    }
}


/* =========================
   RENDER ORDERS
========================= */

function renderOrders(orders) {

    const table = document.getElementById('ordersTable');

    if (!orders.length) {

        table.innerHTML = `
            <tr>
                <td colspan="8" class="empty">
                    لا توجد طلبات
                </td>
            </tr>
        `;

        return;
    }


    table.innerHTML = orders.map(order => `

        <tr>

            <td>${order.id}</td>

            <td>
                <strong>${escapeHTML(order.customer_name || '')}</strong>
            </td>

            <td>
                ${escapeHTML(order.customer_phone || '')}
            </td>

            <td>
                ${escapeHTML(order.delivery_address || '')}
            </td>

            <td>
                ${escapeHTML(order.city || '')}
            </td>

            <td>
                ${order.total_amount ?? 0}
            </td>

            <td>

                <select id="status-${order.id}">

                    <option value="pending"
                        ${order.status === 'pending' ? 'selected' : ''}>
                        Pending
                    </option>

                    <option value="confirmed"
                        ${order.status === 'confirmed' ? 'selected' : ''}>
                        Confirmed
                    </option>

                    <option value="processing"
                        ${order.status === 'processing' ? 'selected' : ''}>
                        Processing
                    </option>

                    <option value="delivered"
                        ${order.status === 'delivered' ? 'selected' : ''}>
                        Delivered
                    </option>

                    <option value="cancelled"
                        ${order.status === 'cancelled' ? 'selected' : ''}>
                        Cancelled
                    </option>

                </select>

            </td>

            <td>

                <button
                    class="save-btn"
                    onclick="updateOrderStatus(${order.id})">
                    حفظ
                </button>

            </td>

        </tr>

    `).join('');
}


/* =========================
   UPDATE STATUS
========================= */

async function updateOrderStatus(orderId) {

    const select = document.getElementById(`status-${orderId}`);

    const newStatus = select.value;


    try {

        const { error } = await supabase
            .from('orders')
            .update({
                status: newStatus
            })
            .eq('id', orderId);


        if (error) throw error;


        /*
         * Add status to delivery history
         */

        const { error: historyError } = await supabase
            .from('delivery_history')
            .insert({
                order_id: orderId,
                status: newStatus,
                notes: `Order status changed to ${newStatus}`
            });


        if (historyError) {

            console.error(
                "History error:",
                historyError
            );

        }


        showMessage(
            "تم تحديث حالة الطلب بنجاح",
            "success"
        );


        await loadOrders();

        await loadHistory();


    } catch (error) {

        console.error(error);

        showMessage(
            "فشل تحديث الطلب: " + error.message,
            "error"
        );

    }
}


/* =========================
   LOAD DELIVERY HISTORY
========================= */

async function loadHistory() {

    try {

        const { data, error } = await supabase
            .from('delivery_history')
            .select('*')
            .order('created_at', {
                ascending: false
            });


        if (error) throw error;


        const table =
            document.getElementById('historyTable');


        if (!data || !data.length) {

            table.innerHTML = `
                <tr>
                    <td colspan="5" class="empty">
                        لا يوجد سجل توصيل
                    </td>
                </tr>
            `;

            return;
        }


        table.innerHTML = data.map(item => `

            <tr>

                <td>${item.id}</td>

                <td>
                    #${item.order_id}
                </td>

                <td>

                    <span class="status ${item.status}">
                        ${escapeHTML(item.status)}
                    </span>

                </td>

                <td>
                    ${escapeHTML(item.notes || '')}
                </td>

                <td>
                    ${formatDate(item.created_at)}
                </td>

            </tr>

        `).join('');


    } catch (error) {

        console.error(error);

        showMessage(
            "فشل تحميل سجل التوصيل: " +
            error.message,
            "error"
        );

    }
}


/* =========================
   STATISTICS
========================= */

function updateStats(orders) {

    document.getElementById(
        'totalOrders'
    ).textContent = orders.length;


    document.getElementById(
        'pendingOrders'
    ).textContent =
        orders.filter(
            order => order.status === 'pending'
        ).length;


    document.getElementById(
        'confirmedOrders'
    ).textContent =
        orders.filter(
            order => order.status === 'confirmed'
        ).length;


    document.getElementById(
        'deliveredOrders'
    ).textContent =
        orders.filter(
            order => order.status === 'delivered'
        ).length;
}


/* =========================
   SEARCH
========================= */

function filterOrders() {

    const search =
        document
            .getElementById('searchInput')
            .value
            .toLowerCase()
            .trim();


    if (!search) {

        renderOrders(allOrders);

        return;
    }


    const filtered = allOrders.filter(order => {

        return (

            String(order.customer_name || '')
                .toLowerCase()
                .includes(search)

            ||

            String(order.customer_phone || '')
                .toLowerCase()
                .includes(search)

            ||

            String(order.delivery_address || '')
                .toLowerCase()
                .includes(search)

            ||

            String(order.city || '')
                .toLowerCase()
                .includes(search)

            ||

            String(order.id)
                .includes(search)

        );

    });


    renderOrders(filtered);
}


/* =========================
   LOGOUT
========================= */

async function logout() {

    try {

        await supabase.auth.signOut();

    } catch (error) {

        console.error(error);

    }

    window.location.href = 'login.html';
}


/* =========================
   HELPERS
========================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}


function formatDate(date) {

    if (!date) return '-';

    return new Date(date).toLocaleString(
        'en-GB',
        {
            dateStyle: 'short',
            timeStyle: 'short'
        }
    );
}


function showMessage(text, type) {

    const message =
        document.getElementById('message');

    message.textContent = text;

    message.className =
        `message ${type}`;

    message.style.display = 'block';


    setTimeout(() => {

        message.style.display = 'none';

    }, 3500);
}


/* =========================
   START
========================= */

document.addEventListener(
    'DOMContentLoaded',
    async () => {

        await loadOrders();

        await loadHistory();

    }
);

</script>

</body>
</html>
