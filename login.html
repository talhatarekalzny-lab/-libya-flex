<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>بوابة الإدارة — LIBYA FLEX</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@600;700&display=swap" rel="stylesheet"><style>:root{--bg:#100f0d;--panel:#191714;--text:#f3ebdf;--muted:#b2a89a;--line:#393229;--gold:#d8c09a;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 0,#57442b55,transparent 55%),var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',sans-serif}body[data-theme="light"]{--bg:#f4f0e8;--panel:#fffdf8;--text:#211b15;--muted:#756c61;--line:#ded4c6;--gold:#b38d59;color-scheme:light}.card{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);padding:32px;box-shadow:0 25px 80px #0008}.brand{text-align:center;direction:ltr;font:700 22px Manrope;letter-spacing:4px}.brand small{display:block;font:9px Manrope;letter-spacing:3px;color:var(--gold);margin-top:5px}.mark{width:64px;height:64px;border:1px solid var(--gold);border-radius:50%;margin:0 auto 15px;display:grid;place-items:center;color:var(--gold);font:italic 26px Georgia}.top{display:flex;justify-content:flex-end}.theme{background:transparent;color:var(--text);border:1px solid var(--line);padding:8px 12px;font:inherit;font-size:11px}h1{text-align:center;font-size:23px;margin:28px 0 5px}p{text-align:center;color:var(--muted);font-size:12px;line-height:1.9}label{display:block;margin:17px 0 6px;font-size:12px}input{width:100%;padding:13px;background:var(--bg);border:1px solid var(--line);color:var(--text);font:inherit;outline:none}button.submit{width:100%;margin-top:22px;padding:14px;border:0;background:var(--gold);color:#1b150e;font:700 14px 'IBM Plex Sans Arabic';cursor:pointer}.msg{min-height:24px;color:#d18a7e;font-size:12px;text-align:center}.back{display:block;text-align:center;color:var(--muted);font-size:12px;margin-top:15px}.security{margin-top:22px;border-top:1px solid var(--line);padding-top:15px;font-size:10px;color:var(--muted);text-align:center}
/* Modern login controls */
button,.theme{transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
button.submit{background:linear-gradient(135deg,#3478f6,#1d4ed8);color:#fff;border:1px solid #5b91ff;border-radius:13px;box-shadow:0 9px 24px #1d4ed844;font-size:14px}
button.submit:hover{transform:translateY(-2px);box-shadow:0 13px 30px #1d4ed866}
button.submit:disabled{opacity:.65;transform:none}
.theme{border-radius:12px;padding:9px 14px}
input{border-radius:11px;transition:border-color .18s,box-shadow .18s}
input:focus{border-color:#4b83ee;box-shadow:0 0 0 3px #2563eb20}
.card{border-radius:22px}

/* LIBYA FLEX — Luxury champagne-gold identity refresh */
:root{--gold:#c7a66a!important;--gold2:#9b7846!important;--line:#403629!important}
button,.btn,.primary,.heroCta,.addBtn,.category,.themebtn,.iconbtn,.close,.logout,.nav button,.tab, [role="button"]{transition:background .22s ease,color .22s ease,border-color .22s ease,box-shadow .22s ease,transform .18s ease!important}
button:not(:disabled),.btn,.primary,.heroCta,.addBtn,.category,.logout,.nav button{border-radius:14px!important}
.primary,.btn:not(.ghost):not(.danger),.heroCta,.addBtn{background:linear-gradient(135deg,#e1c995 0%,#c7a66a 48%,#a9824d 100%)!important;color:#1b150e!important;border:1px solid #ead8b2!important;box-shadow:0 8px 24px #c7a66a25,inset 0 1px #fff5!important;font-weight:800!important}
.primary:hover,.btn:not(.ghost):not(.danger):hover,.heroCta:hover,.addBtn:hover{background:linear-gradient(135deg,#f0dfb8,#d1b47b 52%,#b28c56)!important;box-shadow:0 10px 30px #c7a66a40,inset 0 1px #fff8!important;transform:translateY(-2px)!important}
button:active,.btn:active,.primary:active,.heroCta:active{transform:scale(.975)!important}
.btn.ghost,.iconbtn,.themebtn,.close,.logout{background:linear-gradient(145deg,#211c16,#17130f)!important;color:#e6d2a5!important;border:1px solid #665337!important;box-shadow:inset 0 1px #ffffff0b,0 4px 14px #0003!important}
.btn.ghost:hover,.iconbtn:hover,.themebtn:hover,.close:hover,.logout:hover{border-color:#d1b47b!important;background:#302619!important;color:#f5e7c9!important}
.btn.danger,.danger{background:#39201b!important;color:#e5b0a3!important;border:1px solid #805044!important}
input:focus,select:focus,textarea:focus{outline:none!important;border-color:#c7a66a!important;box-shadow:0 0 0 3px #c7a66a22!important}
.category.active,.category[aria-pressed="true"],.nav button.active{background:linear-gradient(135deg,#d9bd86,#b18a53)!important;color:#1b150e!important;border-color:#ead8b2!important}
.productCard,.dialog,.heroShell,.editorial,.card,.panel,.statCard,.tableWrap{border-color:#4a3b29!important}
.announcement{background:linear-gradient(90deg,#21180f,#4b3921,#21180f)!important}
.heroCta{border-radius:18px!important;padding:17px 28px!important}
@media(max-width:700px){button,.btn,.primary,.heroCta,.addBtn{min-height:42px}.heroCta{width:100%;justify-content:center}}

</style></head><body data-theme="dark"><main class="card"><div class="top"><button class="theme" id="theme">☼ الوضع الأبيض</button></div><div class="mark">LF</div><div class="brand">LIBYA FLEX<small>PRIVATE ADMIN ACCESS</small></div><h1>بوابة إدارة المتجر</h1><p>هذه المنطقة مخصصة لفريق الإدارة المصرّح له فقط.</p><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><button class="submit" id="submit">تسجيل الدخول بأمان</button><div class="msg" id="msg"></div><a class="back" href="index.html">العودة إلى المتجر</a><div class="security">الوصول محمي بتسجيل الدخول والتحقق من صلاحية المدير على قاعدة البيانات.</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const $=id=>document.getElementById(id),cfg=window.LF_CONFIG||{},key='lf-theme-v3';function setTheme(t){document.body.dataset.theme=t;localStorage.setItem(key,t);$('theme').textContent=t==='light'?'◐ الوضع الأسود':'☼ الوضع الأبيض'}setTheme(localStorage.getItem(key)||'dark');$('theme').onclick=()=>setTheme(document.body.dataset.theme==='dark'?'light':'dark');let db=cfg.supabaseUrl&&cfg.supabaseAnonKey?supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey):null;let params=new URLSearchParams(location.search);if(params.get('denied'))$('msg').textContent='الحساب صحيح لكن ليس لديه صلاحية مدير.';if(!db)$('msg').textContent='إعداد اتصال Supabase مطلوب قبل تسجيل الدخول.';$('submit').onclick=async()=>{if(!db)return;let email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('msg').textContent='أدخل البريد الإلكتروني وكلمة المرور.';return}$('submit').disabled=true;$('submit').textContent='جارٍ التحقق...';let {error}=await db.auth.signInWithPassword({email,password});if(error){$('msg').textContent='تعذر تسجيل الدخول. تحقق من بيانات الحساب.';$('submit').disabled=false;$('submit').textContent='تسجيل الدخول بأمان';return}let check=await db.rpc('is_admin');if(check.error||check.data!==true){await db.auth.signOut();$('msg').textContent='هذا الحساب غير مصرح له بالدخول إلى لوحة الإدارة.';$('submit').disabled=false;$('submit').textContent='تسجيل الدخول بأمان';return}location.replace('admin.html')};$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('submit').click()});</script></body></html>
